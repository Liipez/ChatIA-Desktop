# Modelo de configuração do HyvexIA.
#
# NÃO coloque credenciais reais neste arquivo (ele é versionado).
# Copie-o para:
#   Windows:      %APPDATA%\HyvexIA\config.properties
#   Linux/macOS:  ~/.hyvexia/config.properties
# e preencha os valores. Variáveis de ambiente com o mesmo nome têm prioridade.

# Obrigatórios
MONGODB_URI=mongodb+srv://USUARIO:SENHA@SEU-CLUSTER.mongodb.net/?retryWrites=true&w=majority
GROQ_API_KEY=gsk_sua_chave_aqui

# Opcional (padrão: chatia)
MONGODB_DATABASE=chatia

# Recuperação de senha por e-mail (Gmail: use uma "senha de app")
SMTP_HOST=smtp.gmail.com
SMTP_PORT=587
SMTP_USER=seuemail@gmail.com
SMTP_PASSWORD=sua_senha_de_app
